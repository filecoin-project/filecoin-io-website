name: Editorial quality

on:
  push:
    branches: [ciimprovements]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check changed content
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -o pipefail
          git diff --name-only --diff-filter=ACMRT -z "$BASE_REF" HEAD -- apps/filecoin-site/content | node scripts/check-content.mjs

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Review PR dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Review branch dependencies
        if: github.event_name != 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          base-ref: main
          head-ref: ${{ github.sha }}

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:versions
      - name: Check formatting of changed code and configuration
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMRT -z "$BASE_REF" HEAD)
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.css|*.json|*.yml|*.yaml) files+=("$file") ;;
            esac
          done
          if ((${#files[@]})); then npx prettier --check "${files[@]}"; fi
