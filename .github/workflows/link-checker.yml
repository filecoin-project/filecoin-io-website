name: Site Link Checker

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://filecoin.io/

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Lychee Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: |
            --accept 100..=103,200..=299,403,429
            --base-url ${{ env.BASE_URL }}
            --retry-wait-time 3
            --max-retries 3
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; LinkChecker/1.0)"
            --verbose
            "apps/filecoin-site/content/**/*.md"

      - name: Notify Slack on Link Check Results
        if: always()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "Link Checker Results for filecoin.io (filecoin-io-website): ${{ steps.lychee.outcome == 'success' && '✅ All links OK' || '❌ Broken links found' }} - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
            }
