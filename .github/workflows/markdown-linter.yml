name: Markdown Linter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint changed Markdown
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          git diff --name-only --diff-filter=ACMRT -z "$PR_BASE_SHA" HEAD -- '*.md' | \
            xargs -0 -r -- npx markdownlint-cli2 --config .markdownlint.jsonc
