# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x supports TypeScript >=4.8.4 <6.1.0. Anything newer
      # breaks `npm ci` (ERESOLVE) and fails the whole grouped PR. Raise this once
      # typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    versioning-strategy: increase
    commit-message:
      prefix: "[DEPENDABOT] Weekly npm updates"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "[DEPENDABOT] Weekly GitHub Actions updates"
      include: "scope"
